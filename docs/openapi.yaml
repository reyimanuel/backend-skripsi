openapi: 3.0.3
info:
  title: Letter Administration API
  version: 1.1.0
  description: |
    Updated user verification model with centralized email verification and
    student-specific admin verification.
servers:
  - url: /api
paths:
  /users/login:
    post:
      summary: Login user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login success
  /users/verify-email:
    post:
      summary: Verify email by token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token:
                  type: string
      responses:
        '200':
          description: Email verified
  /users/resend-verification:
    post:
      summary: Resend email verification token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        '200':
          description: Verification email resent
  /users/me:
    get:
      summary: Get current user profile
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user profile
  /users/pending/students:
    get:
      summary: List pending students (admin)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Pending students list
  /users/students/{id}/approve:
    post:
      summary: Approve student admin verification (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Student approved
  /users/students/{id}/reject:
    post:
      summary: Reject student admin verification (admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason:
                  type: string
      responses:
        '200':
          description: Student rejected
  /users/officials:
    post:
      summary: Create official account by admin
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password, role_code, jabatan]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                role_code:
                  type: string
                  enum: [DEKAN, WAKIL_DEKAN]
                nip:
                  type: string
                pangkat:
                  type: string
                jabatan:
                  type: string
                signature:
                  type: string
      responses:
        '201':
          description: Official created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
