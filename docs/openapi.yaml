openapi: 3.0.3
info:
  title: Letter Administration API
  version: 1.4.0
  description: |
    API untuk administrasi surat kampus (mahasiswa, admin, dan atasan).

    Catatan:
    - Semua response JSON menggunakan envelope: { status_code, message, data? }.
    - Endpoint preview mengembalikan PDF (bukan JSON).
    - Akses berbasis role (ADMIN/MAHASISWA/ATASAN) diterapkan lewat middleware.
servers:
  - url: /api

tags:
  - name: Users
    description: Autentikasi dan manajemen profil pengguna
  - name: Admin Users
    description: Manajemen pengguna oleh Admin (CRUD, undangan, verifikasi)
  - name: Letters
    description: Template surat, jenis surat, dan requirements lampiran
  - name: Correspondence
    description: Pengajuan, pengelolaan, dan persetujuan surat korespondensi
  - name: Notifications
    description: Notifikasi push (FCM) dan status notifikasi
  - name: Events
    description: Server-Sent Events (SSE) untuk pembaruan data real-time

paths:
  # ─── AUTENTIKASI ─────────────────────────────────────────────────────────────
  /users/login:
    post:
      tags: [Users]
      summary: Login pengguna
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'
        '401':
          description: Kredensial tidak valid

  /users/refresh:
    post:
      tags: [Users]
      summary: Perbarui access token menggunakan refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenRequest'
      responses:
        '200':
          description: Token berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenEnvelope'

  /users/logout:
    post:
      tags: [Users]
      summary: Logout (invalidasi refresh token)
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logout berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  # ─── AKTIVASI UNDANGAN (PUBLIK) ───────────────────────────────────────────────
  /users/staff-invitations/complete:
    post:
      tags: [Users]
      summary: Selesaikan aktivasi undangan staff (via link email)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Token aktivasi dari email undangan
                password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Aktivasi staff berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/student-invitations/complete:
    post:
      tags: [Users]
      summary: Selesaikan aktivasi undangan mahasiswa (via link email)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [token, password]
              properties:
                token:
                  type: string
                  description: Token aktivasi dari email undangan
                password:
                  type: string
                  format: password
                  minLength: 6
                kredensial:
                  type: string
                  format: binary
                  description: Berkas KTM/kredensial mahasiswa (opsional)
      responses:
        '200':
          description: Aktivasi mahasiswa berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  # ─── PROFIL PENGGUNA ──────────────────────────────────────────────────────────
  /users/me:
    get:
      tags: [Users]
      summary: Ambil profil pengguna yang sedang login
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
    patch:
      tags: [Users]
      summary: Perbarui profil sendiri
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMyProfileRequest'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/me/fcm-token:
    post:
      tags: [Users]
      summary: Simpan atau perbarui FCM token perangkat untuk notifikasi push
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertFCMTokenRequest'
      responses:
        '200':
          description: Token berhasil disimpan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
    delete:
      tags: [Users]
      summary: Hapus FCM token perangkat
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteFCMTokenRequest'
      responses:
        '200':
          description: Token berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  # ─── MANAJEMEN PENGGUNA (ADMIN) ───────────────────────────────────────────────
  /users/all:
    get:
      tags: [Admin Users]
      summary: Admin — daftar semua pengguna
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar semua pengguna
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListEnvelope'

  /users/{id}:
    patch:
      tags: [Admin Users]
      summary: Admin — perbarui data pengguna
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: Pengguna berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'
    delete:
      tags: [Admin Users]
      summary: Admin — hapus pengguna
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Pengguna berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/staffs:
    post:
      tags: [Admin Users]
      summary: Admin — kirim undangan akun staff (Admin atau Atasan)
      description: |
        Membuat undangan untuk staff. Email undangan akan dikirimkan ke alamat yang ditentukan.
        Staff mengaktifkan akunnya melalui link di email (endpoint `/users/staff-invitations/complete`).
        Field NIP dan jabatan wajib diisi jika role_code = ATASAN.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStaffRequest'
      responses:
        '201':
          description: Undangan staff berhasil dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/students/invitations:
    post:
      tags: [Admin Users]
      summary: Admin — kirim undangan akun mahasiswa
      description: |
        Membuat undangan untuk mahasiswa. Email undangan akan dikirimkan ke alamat yang ditentukan.
        Mahasiswa mengaktifkan akunnya melalui link di email (endpoint `/users/student-invitations/complete`).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStudentInvitationRequest'
      responses:
        '201':
          description: Undangan mahasiswa berhasil dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/students/invitations/bulk:
    post:
      tags: [Admin Users]
      summary: Admin — impor undangan mahasiswa dari CSV/XLSX secara massal
      description: |
        Unggah file CSV atau XLSX dengan kolom: `nama`, `nim`, `email`, `program_studi`, `angkatan`, `semester_masuk_kuliah`.
        Sistem akan memproses setiap baris dan melaporkan status sukses/gagal per baris.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Berkas CSV atau XLSX dengan header kolom yang sesuai
      responses:
        '200':
          description: Hasil impor undangan massal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkImportEnvelope'

  /users/resend-invitation/{id}:
    post:
      tags: [Admin Users]
      summary: Admin — kirim ulang email undangan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: user_id pengguna yang undangannya akan dikirim ulang
          schema: { type: integer }
      responses:
        '200':
          description: Email undangan berhasil dikirim ulang
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/pending/students:
    get:
      tags: [Admin Users]
      summary: Admin — daftar mahasiswa yang menunggu verifikasi
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar mahasiswa pending verifikasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingStudentListEnvelope'

  /users/students/{id}/approve:
    post:
      tags: [Admin Users]
      summary: Admin — setujui verifikasi mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: student_id
          schema: { type: integer }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveStudentRequest'
      responses:
        '200':
          description: Mahasiswa berhasil disetujui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /users/students/{id}/reject:
    post:
      tags: [Admin Users]
      summary: Admin — tolak verifikasi mahasiswa
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: student_id
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectStudentRequest'
      responses:
        '200':
          description: Mahasiswa berhasil ditolak
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  # ─── TEMPLATE SURAT ───────────────────────────────────────────────────────────
  /letters/templates:
    get:
      tags: [Letters]
      summary: Daftar semua template surat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar template surat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemplateListEnvelope'

  /letters/lettertypes:
    get:
      tags: [Letters]
      summary: Daftar semua jenis surat
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar jenis surat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /letters/lettertype/{id}:
    put:
      tags: [Letters]
      summary: Admin — perbarui metadata jenis surat
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_type_id
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLetterTypeRequest'
      responses:
        '200':
          description: Jenis surat berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /letters/templates/upload:
    post:
      tags: [Letters]
      summary: Admin — unggah template surat baru (analisis placeholder otomatis)
      description: |
        Unggah file .docx sebagai template surat. Sistem akan menganalisis placeholder secara otomatis.

        Jika `letter_type_id` diisi: mengganti template yang sudah ada.
        Jika tidak diisi: `code` dan `name` wajib diisi untuk membuat jenis surat baru.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadTemplateMultipart'
      responses:
        '201':
          description: Template berhasil diunggah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadTemplateEnvelope'

  /letters/template/{id}:
    delete:
      tags: [Letters]
      summary: Admin — hapus template surat berdasarkan letter_type_id
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_type_id
          schema: { type: integer }
      responses:
        '200':
          description: Template berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /letters/preview/{id}:
    get:
      tags: [Letters]
      summary: Preview template surat (PDF)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_type_id
          schema: { type: integer }
      responses:
        '200':
          description: Aliran PDF preview template
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /letters/requirements/{id}:
    get:
      tags: [Letters]
      summary: Ambil persyaratan lampiran untuk jenis surat
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_type_id
          schema: { type: integer }
      responses:
        '200':
          description: Persyaratan lampiran
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterTypeRequirementsEnvelope'
    put:
      tags: [Letters]
      summary: Admin — perbarui persyaratan lampiran untuk jenis surat
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_type_id
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAttachmentRequirementsRequest'
      responses:
        '200':
          description: Persyaratan lampiran berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  # ─── KORESPONDENSI ────────────────────────────────────────────────────────────
  /correspondence/letters:
    get:
      tags: [Correspondence]
      summary: Daftar surat (Mahasiswa melihat suratnya sendiri; Admin melihat semua)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
          description: Kata kunci pencarian subjek
        - in: query
          name: status
          schema:
            type: string
            enum: [submitted, forwarded, approved, rejected]
        - in: query
          name: letter_type_id
          schema: { type: integer }
        - in: query
          name: created_from
          schema: { type: string }
          description: RFC3339 atau yyyy-mm-dd
        - in: query
          name: created_to
          schema: { type: string }
          description: RFC3339 atau yyyy-mm-dd
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at_desc, created_at_asc]
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Daftar surat dengan paginasi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterListEnvelope'

  /correspondence/forwarded:
    get:
      tags: [Correspondence]
      summary: Daftar surat yang diteruskan ke atasan yang sedang login
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: letter_type_id
          schema: { type: integer }
        - in: query
          name: created_from
          schema: { type: string }
        - in: query
          name: created_to
          schema: { type: string }
        - in: query
          name: sort
          schema:
            type: string
            enum: [created_at_desc, created_at_asc]
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: page_size
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Daftar surat yang diteruskan ke atasan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LetterListEnvelope'

  /correspondence/atasan:
    get:
      tags: [Correspondence]
      summary: Daftar atasan aktif (untuk pilihan tujuan disposisi surat)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Daftar atasan aktif
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /correspondence/drafts:
    post:
      tags: [Correspondence]
      summary: Mahasiswa — buat draft surat baru
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDraftRequest'
      responses:
        '201':
          description: Draft surat berhasil dibuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'

  /correspondence/drafts/{id}:
    patch:
      tags: [Correspondence]
      summary: Mahasiswa — perbarui draft surat
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDraftRequest'
      responses:
        '200':
          description: Draft berhasil diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftEnvelope'

  /correspondence/submit/{id}:
    post:
      tags: [Correspondence]
      summary: Mahasiswa — ajukan draft surat ke admin
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      responses:
        '200':
          description: Surat berhasil diajukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewEnvelope'

  /correspondence/{id}:
    delete:
      tags: [Correspondence]
      summary: Hapus surat (Mahasiswa pemilik atau Admin)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      responses:
        '200':
          description: Surat berhasil dihapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /correspondence/preview/{id}:
    get:
      tags: [Correspondence]
      summary: Preview surat (PDF) — Mahasiswa, Admin, dan Atasan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      responses:
        '200':
          description: Aliran PDF preview surat
          content:
            application/pdf:
              schema:
                type: string
                format: binary

  /correspondence/history/{id}:
    get:
      tags: [Correspondence]
      summary: Detail surat beserta riwayat tindakan — Mahasiswa, Admin, dan Atasan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      responses:
        '200':
          description: Detail surat dan riwayat tindakan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HistoryEnvelope'

  /correspondence/approve/{id}:
    patch:
      tags: [Correspondence]
      summary: Tinjau surat — approve / reject / forward
      description: |
        **Admin:**
        - `forward`: meneruskan surat (status submitted → forwarded) ke atasan yang dipilih via `target_atasan_id`
        - `approve`: menyetujui surat (wajib mengisi `letter_number`)
        - `reject`: menolak surat (disarankan mengisi `notes`)

        **Atasan:**
        - `approve`: menyetujui surat yang diteruskan ke atasan tersebut (wajib `letter_number`)
        - `reject`: menolak surat yang diteruskan
        - Hanya dapat memproses surat yang ditugaskan ke atasan yang bersangkutan
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApproveLetterRequest'
      responses:
        '200':
          description: Tindakan berhasil diproses
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PreviewEnvelope'

  /correspondence/attachments/{id}:
    post:
      tags: [Correspondence]
      summary: Unggah lampiran surat (Mahasiswa atau Admin)
      description: |
        Unggah satu atau beberapa berkas lampiran untuk surat.

        - **Satu berkas**: gunakan field `file` dan `key`
        - **Beberapa berkas**: gunakan field `files[]` dan `keys[]` (jumlah harus sama)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          description: letter_id
          schema: { type: integer }
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadAttachmentsMultipart'
      responses:
        '201':
          description: Lampiran berhasil diunggah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadAttachmentsEnvelope'

  # ─── NOTIFIKASI ───────────────────────────────────────────────────────────────
  /notifications/recent:
    get:
      tags: [Notifications]
      summary: Daftar notifikasi terbaru
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: days
          schema:
            type: integer
            minimum: 1
            maximum: 30
            default: 7
          description: Rentang hari ke belakang (1–30, bawaan 7)
      responses:
        '200':
          description: Daftar notifikasi dalam rentang waktu yang ditentukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationListEnvelope'

  /notifications/status:
    get:
      tags: [Notifications]
      summary: Status token perangkat dan kesiapan FCM pengguna
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Status notifikasi pengguna saat ini
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /notifications/{id}/read:
    patch:
      tags: [Notifications]
      summary: Tandai notifikasi sebagai sudah dibaca
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Notifikasi ditandai sudah dibaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BasicEnvelope'

  /notifications/test:
    post:
      tags: [Notifications]
      summary: Kirim notifikasi uji ke semua perangkat pengguna sendiri
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendTestNotificationRequest'
      responses:
        '200':
          description: Notifikasi uji dikirim
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SendTestEnvelope'

  # ─── SERVER-SENT EVENTS ───────────────────────────────────────────────────────
  /events/stream:
    get:
      tags: [Events]
      summary: Stream pembaruan data real-time via Server-Sent Events (SSE)
      description: |
        Koneksi SSE persisten. Klien menerima event saat ada perubahan data
        (surat baru, status berubah, notifikasi baru, dll).
        Autentikasi via header `Authorization: Bearer <token>`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Stream SSE aktif
          content:
            text/event-stream:
              schema:
                type: string

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # ── Envelope umum ──────────────────────────────────────────────────────────
    BasicEnvelope:
      type: object
      required: [status_code, message]
      properties:
        status_code: { type: integer, example: 200 }
        message: { type: string, example: "OK" }
        data:
          nullable: true
          description: Payload opsional

    # ── Autentikasi ────────────────────────────────────────────────────────────
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }

    RefreshTokenRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string }

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string }

    TokenResponse:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }

    TokenEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TokenResponse'

    # ── Profil pengguna ────────────────────────────────────────────────────────
    MeResponse:
      type: object
      required: [user_id, name, email, roles, is_active, created_at]
      properties:
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        profile_photo: { type: string, nullable: true }
        roles:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        # Atribut tambahan mahasiswa
        student_id: { type: integer, nullable: true }
        nim: { type: string, nullable: true }
        program_studi: { type: string, nullable: true }
        angkatan: { type: integer, nullable: true }
        semester_masuk_kuliah: { type: string, nullable: true, enum: [Ganjil, Genap] }
        kredensial_path: { type: string, nullable: true }
        admin_verification_status: { type: string, nullable: true }
        admin_verified_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }
        # Atribut tambahan atasan/pimpinan
        atasan_id: { type: integer, nullable: true }
        nip: { type: string, nullable: true }
        pangkat: { type: string, nullable: true }
        jabatan: { type: string, nullable: true }
        signature: { type: string, nullable: true }
        is_on_duty: { type: boolean, nullable: true }

    MeEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/MeResponse'

    UpdateMyProfileRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        profile_photo: { type: string, nullable: true }

    UpsertFCMTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }
        platform:
          type: string
          nullable: true
          enum: [web, android, ios]

    DeleteFCMTokenRequest:
      type: object
      required: [token]
      properties:
        token: { type: string }

    # ── Manajemen pengguna (Admin) ─────────────────────────────────────────────
    UserListResponse:
      type: object
      required: [user_id, name, email, roles, is_active, created_at]
      properties:
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string }
        is_active: { type: boolean }
        email_verified_at: { type: string, format: date-time, nullable: true }
        student_id: { type: integer, nullable: true }
        admin_verification_status: { type: string, nullable: true }
        admin_verified_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    UserListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/UserListResponse'

    AdminUpdateUserRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        is_active: { type: boolean, nullable: true }
        profile_photo: { type: string, nullable: true }

    CreateStaffRequest:
      type: object
      required: [name, email, role_code]
      description: |
        Membuat undangan staff. Staff mengatur password sendiri melalui email aktivasi.
        NIP dan jabatan wajib jika role_code = ATASAN.
      properties:
        name: { type: string, minLength: 3, maxLength: 100 }
        email: { type: string, format: email }
        role_code:
          type: string
          enum: [ADMIN, ATASAN]
        nip:
          type: string
          description: Wajib jika role_code = ATASAN (8–30 digit angka)
          nullable: true
        pangkat: { type: string, nullable: true }
        jabatan:
          type: string
          description: Wajib jika role_code = ATASAN
          nullable: true

    CreateStudentInvitationRequest:
      type: object
      required: [name, nim, email, program_studi, angkatan]
      properties:
        name: { type: string }
        nim: { type: string }
        email: { type: string, format: email }
        program_studi: { type: string }
        angkatan: { type: integer, description: "Tahun angkatan, contoh: 2022" }
        semester_masuk_kuliah:
          type: string
          nullable: true
          enum: [Ganjil, Genap]

    BulkImportItem:
      type: object
      properties:
        row: { type: integer }
        name: { type: string }
        nim: { type: string }
        email: { type: string, format: email }
        program_studi: { type: string, nullable: true }
        angkatan: { type: integer, nullable: true }
        semester_masuk_kuliah: { type: string, nullable: true }
        status:
          type: string
          enum: [success, failed]
        error: { type: string, nullable: true }

    BulkImportData:
      type: object
      required: [total_count, success_count, failed_count, items]
      properties:
        total_count: { type: integer }
        success_count: { type: integer }
        failed_count: { type: integer }
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkImportItem'

    BulkImportEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/BulkImportData'

    PendingStudentResponse:
      type: object
      required: [student_id, user_id, name, email, nim, program_studi, angkatan, admin_verification_status, created_at]
      properties:
        student_id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
        nim: { type: string }
        program_studi: { type: string }
        angkatan: { type: integer }
        semester_masuk_kuliah: { type: string, nullable: true }
        kredensial: { type: string, nullable: true }
        admin_verification_status: { type: string }
        admin_verified_at: { type: string, format: date-time, nullable: true }
        rejection_reason: { type: string, nullable: true }
        email_verified_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    PendingStudentListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/PendingStudentResponse'

    ApproveStudentRequest:
      type: object
      properties:
        name: { type: string, nullable: true }
        nim: { type: string, nullable: true }
        program_studi: { type: string, nullable: true }
        angkatan: { type: integer, nullable: true }

    RejectStudentRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }

    # ── Template surat ─────────────────────────────────────────────────────────
    TemplateListItem:
      type: object
      required: [id, letter_type_id, code, name, file_path, file_type, created_by, created_at, updated_at]
      properties:
        id: { type: integer }
        letter_type_id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        file_path: { type: string }
        file_type: { type: string }
        created_by: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        required_payload_keys:
          type: array
          items: { type: string }
          nullable: true

    TemplateListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/TemplateListItem'

    UpdateLetterTypeRequest:
      type: object
      properties:
        code: { type: string, nullable: true }
        name: { type: string, nullable: true }
        description: { type: string, nullable: true }
        kode_kerja: { type: string, nullable: true }
        kode_klasifikasi: { type: string, nullable: true }

    UploadTemplateMultipart:
      type: object
      required: [file]
      properties:
        letter_type_id:
          type: string
          description: Isi untuk mengganti template jenis surat yang sudah ada
          nullable: true
        code:
          type: string
          description: Wajib jika letter_type_id tidak diisi (untuk jenis surat baru)
        name:
          type: string
          description: Wajib jika letter_type_id tidak diisi
        description:
          type: string
          nullable: true
        file:
          type: string
          format: binary
          description: Berkas template .docx

    TemplateUploadData:
      type: object
      required: [letter_type_id, code, name, file_path, placeholders, auto_filled_keys, required_payload_keys]
      properties:
        letter_type_id: { type: integer }
        code: { type: string }
        name: { type: string }
        description: { type: string, nullable: true }
        file_path: { type: string }
        placeholders:
          type: array
          items: { type: string }
        auto_filled_keys:
          type: array
          items: { type: string }
        required_payload_keys:
          type: array
          items: { type: string }

    UploadTemplateEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/TemplateUploadData'

    AttachmentRequirement:
      type: object
      required: [key, label, required]
      properties:
        key: { type: string }
        label: { type: string }
        required: { type: boolean }
        accept: { type: string, nullable: true }

    UpdateAttachmentRequirementsRequest:
      type: object
      required: [requirements]
      properties:
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRequirement'

    LetterTypeRequirementsResponse:
      type: object
      required: [letter_type_id, code, name, requirements]
      properties:
        letter_type_id: { type: integer }
        code: { type: string }
        name: { type: string }
        requirements:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentRequirement'

    LetterTypeRequirementsEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LetterTypeRequirementsResponse'

    # ── Korespondensi ──────────────────────────────────────────────────────────
    CreateDraftRequest:
      type: object
      required: [letter_type_id, subject, payload]
      properties:
        letter_type_id: { type: integer }
        subject: { type: string }
        payload:
          type: object
          additionalProperties: true

    UpdateDraftRequest:
      type: object
      properties:
        subject: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
          nullable: true

    DraftData:
      type: object
      required: [id, letter_type_id, subject, status, file_path, payload, created_at]
      properties:
        id: { type: integer }
        letter_type_id: { type: integer }
        subject: { type: string }
        status: { type: string }
        file_path: { type: string }
        preview_url: { type: string, nullable: true }
        payload:
          type: object
          additionalProperties: true
        created_at: { type: string, format: date-time }

    DraftEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DraftData'

    PreviewResponse:
      type: object
      required: [id, preview_url]
      properties:
        id: { type: integer }
        preview_url: { type: string }

    PreviewEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/PreviewResponse'

    LetterTypeSummary:
      type: object
      required: [id, code, name]
      properties:
        id: { type: integer }
        code: { type: string }
        name: { type: string }

    StudentSummary:
      type: object
      required: [student_id, user_id, name, nim]
      properties:
        student_id: { type: integer }
        user_id: { type: integer }
        name: { type: string }
        nim: { type: string }

    LetterListItem:
      type: object
      required: [id, subject, status, letter_type, preview_url, history_url, created_at, updated_at]
      properties:
        id: { type: integer }
        subject: { type: string }
        status:
          type: string
          enum: [draft, submitted, forwarded, approved, rejected]
        letter_number: { type: string, nullable: true }
        letter_type:
          $ref: '#/components/schemas/LetterTypeSummary'
        student:
          $ref: '#/components/schemas/StudentSummary'
        preview_url: { type: string }
        history_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PaginationMeta:
      type: object
      required: [page, page_size, total]
      properties:
        page: { type: integer }
        page_size: { type: integer }
        total: { type: integer }

    LetterListData:
      type: object
      required: [items, meta]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LetterListItem'
        meta:
          $ref: '#/components/schemas/PaginationMeta'

    LetterListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LetterListData'

    ApproveLetterRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [approve, reject, forward]
        target_atasan_id:
          type: integer
          description: Wajib jika action = forward. ID atasan tujuan disposisi.
          nullable: true
        letter_number:
          type: string
          description: Wajib jika action = approve.
          nullable: true
        notes:
          type: string
          nullable: true

    AttachmentItem:
      type: object
      required: [id, file_path]
      properties:
        id: { type: integer }
        key: { type: string, nullable: true }
        file_path: { type: string }
        file_type: { type: string, nullable: true }

    LetterHistoryItem:
      type: object
      required: [id, action, created_at]
      properties:
        id: { type: integer }
        action: { type: string }
        notes: { type: string, nullable: true }
        actor:
          type: object
          nullable: true
          properties:
            user_id: { type: integer }
            name: { type: string }
        created_at: { type: string, format: date-time }

    LetterHistoryDetail:
      type: object
      required: [id, letter_type_id, subject, status, payload, attachments, preview_url, created_at, updated_at]
      properties:
        id: { type: integer }
        letter_type_id: { type: integer }
        subject: { type: string }
        status: { type: string }
        payload:
          type: object
          additionalProperties: true
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentItem'
        student:
          $ref: '#/components/schemas/StudentSummary'
        preview_url: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LetterHistoryAndDetailData:
      type: object
      required: [letter, histories]
      properties:
        letter:
          $ref: '#/components/schemas/LetterHistoryDetail'
        histories:
          type: array
          items:
            $ref: '#/components/schemas/LetterHistoryItem'

    HistoryEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/LetterHistoryAndDetailData'

    UploadAttachmentsMultipart:
      type: object
      properties:
        file:
          type: string
          format: binary
          description: Berkas tunggal
        files:
          type: array
          items:
            type: string
            format: binary
          description: Beberapa berkas sekaligus
        key:
          type: string
          description: Kunci lampiran untuk file tunggal
        keys:
          type: array
          items: { type: string }
          description: Kunci lampiran untuk beberapa berkas (jumlah harus sama dengan files)

    UploadAttachmentsResponse:
      type: object
      required: [letter_id, attachments]
      properties:
        letter_id: { type: integer }
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/AttachmentItem'

    UploadAttachmentsEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/UploadAttachmentsResponse'

    # ── Notifikasi ─────────────────────────────────────────────────────────────
    SendTestNotificationRequest:
      type: object
      required: [title, body]
      properties:
        title: { type: string }
        body: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
          nullable: true

    SendResult:
      type: object
      required: [tokens, success, failure, revoked]
      properties:
        tokens: { type: integer }
        success: { type: integer }
        failure: { type: integer }
        revoked: { type: integer }

    SendTestEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/SendResult'

    NotificationItem:
      type: object
      required: [id, title, body, data, is_read, created_at]
      properties:
        id: { type: integer }
        title: { type: string }
        body: { type: string }
        data:
          type: object
          additionalProperties: { type: string }
        is_read: { type: boolean }
        read_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    NotificationListEnvelope:
      allOf:
        - $ref: '#/components/schemas/BasicEnvelope'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/NotificationItem'
